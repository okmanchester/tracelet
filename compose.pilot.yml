# 仅由 verify_pilot 使用：独立项目、临时数据、随机本机端口。
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${TRACELET_PILOT_DB_PASSWORD:?required}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: ${TRACELET_PILOT_DB:?required}
    ports: ["127.0.0.1:${TRACELET_PILOT_MYSQL_PORT:?required}:3306"]
    tmpfs: ["/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysql -h127.0.0.1 -uroot -e "SELECT 1" > /dev/null']
      interval: 3s
      timeout: 5s
      start_period: 20s
      retries: 40
  redis:
    image: redis:7.2
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["127.0.0.1:${TRACELET_PILOT_REDIS_PORT:?required}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  etcd:
    image: quay.io/coreos/etcd:v3.5.14
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    tmpfs: ["/etcd"]
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 10s
      retries: 30
  minio:
    image: milvusdb/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data
    volumes: ["minio_data:/minio_data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 10s
      retries: 30
  milvus:
    image: milvusdb/milvus:v2.4.13
    command: ["milvus", "run", "standalone"]
    security_opt: ["seccomp:unconfined"]
    environment:
      MINIO_REGION: us-east-1
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes: ["milvus_data:/var/lib/milvus"]
    ports: ["127.0.0.1:${TRACELET_PILOT_MILVUS_PORT:?required}:19530"]
    depends_on:
      etcd: {condition: service_healthy}
      minio: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 5s
      timeout: 10s
      start_period: 60s
      retries: 60
volumes:
  minio_data:
  milvus_data:
